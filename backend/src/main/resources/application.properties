# 1. Cổng mạng để Frontend gọi API
server.port=${PORT:8080}

# 2. Thông số kết nối tới MySQL trong XAMPP
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/media_library_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate tự động kiểm tra và cập nhật cấu trúc bảng dữ liệu
spring.jpa.hibernate.ddl-auto=update

# 4. In câu lệnh SQL ra màn hình Terminal để tiện theo dõi khi code
spring.jpa.show-sql=true

# 5. Giới hạn dung lượng upload ảnh poster / avatar
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 6. Cấu hình JWT (JSON Web Token) để xác thực và phân quyền
app.jwt.secret=PersonalLibraryStoriesMoviesSecretKeyForJwtSigning2026VerySecureKey1234567890
app.jwt.expiration-ms=86400000

# 7. Cấu hình gửi Email OTP thật qua giao thức SMTP (Gmail hoặc máy chủ thư)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:lechauanh2512.com@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:uqpxmulghecpikaj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
