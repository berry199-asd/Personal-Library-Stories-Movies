# 1. Cổng mạng để Frontend gọi API
server.port=8080

# 2. Thông số kết nối tới MySQL trong XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/media_library_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate tự động kiểm tra và cập nhật cấu trúc bảng dữ liệu
spring.jpa.hibernate.ddl-auto=update

# 4. In câu lệnh SQL ra màn hình Terminal để tiện theo dõi khi code
spring.jpa.show-sql=true

# 5. Giới hạn dung lượng upload ảnh poster / avatar
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB